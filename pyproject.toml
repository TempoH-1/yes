[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tr1pp-mashup-studio"
version = "2.0.0.dev0"
description = "Source-derived MIDI arrangement, transcription and editing studio — development checkpoint"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
tr1pp = "tr1pp.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["tr1pp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
